name: Validate English and Polish website

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '.idea/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck both languages
        run: npm run typecheck
      - name: Build static website
        run: npm run build
      - name: Verify all 52 exported pages
        run: npm run check:export
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify localization and navigation in Chromium
        run: npm run test:e2e -- tests/localization.spec.ts tests/navigation.spec.ts
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
