name: Validate English and German site

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check both language catalogs and types
        run: npm run typecheck
      - name: Build both languages
        run: npm run build
      - name: Inspect all exported pages and redirects
        run: npm run check:export
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check navigation and localization in the browser
        run: npm run test:e2e
      - name: Save browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
