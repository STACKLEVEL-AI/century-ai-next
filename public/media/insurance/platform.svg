<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="808" viewBox="0 0 1280 808" fill="none">
  <title>Century insurance platform</title>
  <desc>Property, life and health workflows connected to Century, policy systems, CRM and core systems.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M2 2h12v12H2z" fill="#303030"/></pattern>
    <linearGradient id="fade" x1="1080" y1="0" x2="270" y2="808" gradientUnits="userSpaceOnUse"><stop stop-color="white"/><stop offset=".48" stop-color="#aaa"/><stop offset="1" stop-color="#333"/></linearGradient>
    <radialGradient id="edge"><stop offset=".48" stop-color="white"/><stop offset="1" stop-color="black"/></radialGradient>
    <mask id="gridMask"><path fill="url(#fade)" d="M0 0h1280v808H0z"/></mask>
    <mask id="edges"><path fill="url(#edge)" d="M0 0h1280v808H0z"/></mask>
    <g id="cube" stroke="#e5e5e5" stroke-width="2"><path fill="#000" d="m0-40 41 13v53L0 40l-41-14v-53z"/><path d="m-41-27 41 14 41-14M0-13v53"/><path stroke-dasharray="3 4" d="M0-40v27"/></g>
    <g id="system" stroke="#e5e5e5" stroke-width="2"><circle r="40" fill="#000"/><ellipse rx="40" ry="12"/><ellipse rx="12" ry="40" stroke-dasharray="3 5"/><path d="M0-40v80" stroke-dasharray="3 5"/></g>
  </defs>
  <path fill="#000" d="M0 0h1280v808H0z"/>
  <g mask="url(#edges)"><path fill="url(#grid)" mask="url(#gridMask)" d="M0 0h1280v808H0z"/></g>
  <g stroke="#777" stroke-width="2"><path d="M240 226v78h224v56M640 226v134M1040 226v78H816v56M440 456v64H208v48M640 456v112M840 456v64h232v48"/></g>
  <path stroke="#777" stroke-dasharray="8 8" d="M349 342h582v133H349z"/>
  <rect x="369" y="361" width="542" height="94" rx="7" fill="#000" stroke="#c6c6c6" stroke-width="3"/>
  <g fill="#ddd"><path d="M460 356h8v8h-8zM636 356h8v8h-8zM812 356h8v8h-8zM436 452h8v8h-8zM636 452h8v8h-8zM836 452h8v8h-8z"/></g>
  <use href="#cube" x="240" y="132"/><use href="#cube" x="640" y="132"/><use href="#cube" x="1040" y="132"/>
  <use href="#system" x="208" y="608"/><use href="#system" x="640" y="608"/><use href="#system" x="1072" y="608"/>
  <g font-family="monospace" font-size="22" text-anchor="middle" fill="#bcbcbc"><text x="240" y="212">P&amp;C</text><text x="640" y="212">Life</text><text x="1040" y="212">Health</text><text x="208" y="676">Policy systems</text><text x="640" y="676">CRM</text><text x="1072" y="676">Core systems</text></g>
  <text x="640" y="419" font-family="monospace" font-size="28" text-anchor="middle" fill="#eee">Century</text>
</svg>
