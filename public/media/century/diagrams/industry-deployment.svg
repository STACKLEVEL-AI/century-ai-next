<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="808" viewBox="0 0 1280 808" role="img" aria-labelledby="title desc">
  <title id="title">Delivery with ownership</title>
  <desc id="desc">Four connected stages move from scoping a useful workflow through building, validation and handover to the team.</desc>
  <rect width="1280" height="808" fill="#111515"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="88" y="92" fill="#d49c79" font-size="19" letter-spacing="3">DELIVERY WITH OWNERSHIP</text>
    <text x="88" y="151" fill="#f2f1e9" font-size="38">A useful workflow, built together</text>
    <g fill="none" stroke="#53655a" stroke-width="2"><path d="M208 252h864M208 270v60m288-60v60m288-60v60m288-60v60"/></g>
    <g fill="#eeeee6"><circle cx="208" cy="252" r="24"/><circle cx="496" cy="252" r="24"/><circle cx="784" cy="252" r="24"/><circle cx="1072" cy="252" r="24"/></g>
    <g fill="#18231d" font-size="20" text-anchor="middle"><text x="208" y="259">01</text><text x="496" y="259">02</text><text x="784" y="259">03</text><text x="1072" y="259">04</text></g>
    <g fill="#1b2421" stroke="#43514b"><rect x="88" y="330" width="240" height="256" rx="22"/><rect x="376" y="330" width="240" height="256" rx="22"/><rect x="664" y="330" width="240" height="256" rx="22"/><rect x="952" y="330" width="240" height="256" rx="22"/></g>
    <g fill="none" stroke="#d49c79" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="126" cy="381" r="12"/><circle cx="126" cy="381" r="4"/>
      <rect x="402" y="369" width="20" height="20" rx="3"/><rect x="414" y="381" width="20" height="20" rx="3"/>
      <path d="m691 382 8 8 17-19"/>
      <path d="M979 382h27m-9-9 9 9-9 9"/>
    </g>
    <g fill="#f2f1e9" font-size="30"><text x="116" y="449">Scope</text><text x="404" y="449">Build</text><text x="692" y="449">Validate</text><text x="980" y="449">Handover</text></g>
    <g fill="#b1bbb5" font-size="18"><text x="116" y="495">Define the work</text><text x="116" y="525">Agree the boundaries</text><text x="404" y="495">Connect the pieces</text><text x="404" y="525">Build the workflow</text><text x="692" y="495">Review the result</text><text x="692" y="525">Refine with the team</text><text x="980" y="495">Make ownership clear</text><text x="980" y="525">Support daily use</text></g>
    <path d="M88 642h1104" fill="none" stroke="#27312e"/>
    <text x="88" y="699" fill="#b1bbb5" font-size="24">Learn from each step, improve the next</text>
  </g>
</svg>
